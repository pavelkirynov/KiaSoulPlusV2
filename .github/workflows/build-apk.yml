name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which variant to assemble"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kia-soul-ev-plus-v2-${{ inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
