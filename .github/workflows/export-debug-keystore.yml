name: Export debug keystore

# Дістає ключ підпису debug-збірки із секрета DEBUG_KEYSTORE_BASE64 і віддає
# його артефактом, щоб можна було скачати той самий ключ, яким підписує CI, і
# підписувати ним локальні збірки (інакше телефон не прийме локальний APK як
# оновлення поверх збірки з CI, і навпаки).
#
# Запуск лише вручну: артефакт може скачати будь-хто з доступом на читання до
# репозиторію, тому зберігається він один день. Після скачування артефакт
# краще одразу видалити зі сторінки запуску.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up JDK 17 (для keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode the keystore from the secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Секрета DEBUG_KEYSTORE_BASE64 немає в репозиторії — нічого експортувати."
            exit 1
          fi

          mkdir -p out
          # tr прибирає переноси рядків і пробіли, які додає копіювання через буфер.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > out/debug.keystore

          # Перевірка справжнім keytool: обрізаний секрет дає валідний base64,
          # але непридатне сховище.
          if ! keytool -list -keystore out/debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error::DEBUG_KEYSTORE_BASE64 пошкоджений або неповний: keytool не читає сховище."
            echo "::error::Отримано $(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c) символів base64, очікується 3664."
            exit 1
          fi

          echo "Сховище відновлено ($(wc -c < out/debug.keystore) байт). Відбиток сертифіката:"
          keytool -list -v -keystore out/debug.keystore -storepass android 2>/dev/null \
            | grep -i 'SHA256:' | head -1

          cat > out/README.txt <<'TXT'
          debug.keystore — ключ підпису debug-збірки KiaSoulEvPlusV2, той самий, що в CI.

          Параметри (стандартні для debug-ключа Android Studio):
            store password: android
            key alias:      androiddebugkey
            key password:   android

          Як використати локально — один із варіантів:
            1) покласти як app/debug.keystore у клоні репозиторію (файл у .gitignore,
               app/build.gradle.kts підхопить його сам);
            2) або замінити ним ~/.android/debug.keystore, тоді ним підписуватиме
               і Android Studio.
          TXT

      # Хранение 1 день: это секрет, а не обычный артефакт сборки.
      - name: Upload the keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
